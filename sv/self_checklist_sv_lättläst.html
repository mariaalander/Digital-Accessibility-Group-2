<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
          name="description"
          content="En interaktiv checklista för att vara säkrare på internet."
  />
  <title>Checklista | Trygg på internet</title>

  <style>
    :root {
      --navy: #0c2345;
      --light-blue: #b7cde8;
      --title-blue: #b0c9eb;
      --page-background: #f8f8f7;
      --progress-green: #8fbe51;
      --focus: #6a35ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    input:focus-visible,
    button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 4px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 10;
      padding: 0.75rem 1rem;
      border-radius: 0.25rem;
      background: #ffffff;
      font-weight: 700;
      transform: translateY(-200%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    /* Sidhuvud */

    .site-header {
      display: flex;
      min-height: 100px;
      background: var(--navy);
    }

    .brand {
      display: flex;
      align-items: center;
      flex: 1;
      padding: 0.75rem 2rem;
    }

    .brand svg {
      width: 65px;
      height: 75px;
    }

    .site-navigation {
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 0.75rem 2rem;
      background: var(--light-blue);
    }

    .nav-link {
      display: flex;
      min-width: 75px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      padding: 0.35rem 0.4rem;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .nav-link svg {
      width: 48px;
      height: 48px;
      fill: var(--navy);
    }

    /* Reglage för lättläst */

    .easy-toggle {
      border: none;
      background: transparent;
      color: var(--navy);
      font-family: inherit;
      cursor: pointer;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
    }

    .toggle-track {
      position: relative;
      display: block;
      width: 54px;
      height: 28px;
      border-radius: 20px;
      background: #596b80;
      transition: background-color 0.2s ease;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease;
    }

    .easy-toggle[aria-checked="true"] .toggle-track {
      background: var(--navy);
    }

    .easy-toggle[aria-checked="true"] .toggle-thumb {
      transform: translateX(26px);
    }

    .toggle-status {
      display: none;
    }

    .easy-toggle:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 4px;
      border-radius: 0.5rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle-track,
      .toggle-thumb {
        transition: none;
      }
    }

    @media (max-width: 680px) {
      .toggle-wrapper {
        height: 38px;
      }
    }

    /* Sidans titel */

    .title-section {
      position: relative;
      height: 130px;
      background: var(--page-background);
    }

    .page-title {
      position: absolute;
      z-index: 1;
      bottom: -50px;
      left: 50%;
      width: min(90%, 430px);
      margin: 0;
      padding: 1.5rem 1rem;
      border-radius: 2rem;
      background: var(--title-blue);
      text-align: center;
      font-size: 2.2rem;
      line-height: 1.2;
      transform: translateX(-50%);
    }

    /* Huvudinnehåll */

    main {
      min-height: calc(100vh - 230px);
      padding: 1rem 1rem 5rem;
      background: var(--navy);
    }

    .breadcrumb {
      padding: 0.25rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .breadcrumb a {
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .page-content {
      max-width: 900px;
      margin: 0 auto;
      padding-top: 4rem;
    }

    /* Checklistans kort */

    .checklist-card {
      max-width: 650px;
      margin: 0 auto;
      padding: 3rem 2.5rem;
      border-radius: 2rem;
      background: var(--page-background);
    }

    /* Progressbar */

    .progress-container {
      max-width: 380px;
      margin: 0 auto 3.5rem;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      overflow: hidden;
      border-radius: 20px;
      background: var(--light-blue);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 20px;
      background: var(--progress-green);
      transition: width 0.3s ease;
    }

    .progress-text {
      margin: 1.2rem 0 0;
      font-size: 1.1rem;
    }

    /* Checklista */

    .checklist {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .checklist-item input {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      margin: 0.1rem 0 0;
      accent-color: var(--progress-green);
      cursor: pointer;
    }

    .checklist-item label {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.5;
      cursor: pointer;
    }

    .checklist-item input:checked + label {
      color: #48617c;
      text-decoration: line-through;
    }

    /* Återställningsknapp */

    .reset-container {
      margin-top: 3rem;
      text-align: center;
    }

    .reset-button {
      padding: 0.8rem 1.5rem;
      border: 2px solid var(--navy);
      border-radius: 0.75rem;
      background: transparent;
      color: var(--navy);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button:hover {
      background: var(--navy);
      color: #ffffff;
    }

    /* Mobilanpassning */

    @media (max-width: 680px) {
      .site-header {
        min-height: 80px;
      }

      .brand {
        padding: 0.6rem 1rem;
      }

      .brand svg {
        width: 45px;
        height: 55px;
      }

      .site-navigation {
        gap: 0;
        padding: 0.4rem;
      }

      .nav-link {
        min-width: 58px;
        font-size: 0.75rem;
      }

      .nav-link svg {
        width: 38px;
        height: 38px;
      }

      .title-section {
        height: 110px;
      }

      .page-title {
        bottom: -40px;
        padding: 1.2rem 1rem;
        font-size: 1.8rem;
      }

      main {
        padding: 1rem 1rem 3rem;
      }

      .breadcrumb {
        padding: 0.5rem 0;
        font-size: 0.85rem;
      }

      .page-content {
        padding-top: 3.5rem;
      }

      .checklist-card {
        padding: 2rem 1.5rem;
        border-radius: 1.5rem;
      }

      .progress-container {
        margin-bottom: 2.5rem;
      }

      .progress-text {
        font-size: 1rem;
      }

      .checklist {
        gap: 1.5rem;
      }

      .checklist-item input {
        width: 26px;
        height: 26px;
      }

      .checklist-item label {
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill {
        transition: none;
      }
    }
  </style>
</head>

<body>
<a class="skip-link" href="#main-content">
  Hoppa till huvudinnehållet
</a>

<header class="site-header">
  <a
          class="brand"
          href="../index.html"
          aria-label="Trygg på internet, startsida"
  >
    <svg viewBox="0 0 48 54" aria-hidden="true">
      <path
              d="M24 2 43 12v15c0 12-7.5 20.5-19 25C12.5 47.5 5 39 5 27V12L24 2Z"
              fill="none"
              stroke="#ffffff"
              stroke-width="2"
      />
      <path
              d="m13 26 7 7 15-15"
              fill="none"
              stroke="#ffffff"
              stroke-width="2"
      />
    </svg>
  </a>

  <nav class="site-navigation" aria-label="Huvudmeny">
    <button
            class="nav-link easy-toggle"
            id="easy-toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Lättläst"
    >
      <span class="toggle-wrapper" aria-hidden="true">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </span>
      <span>Lättläst</span>
      <span class="toggle-status" aria-hidden="true">Av</span>
    </button>

    <a class="nav-link" href="#kontakt">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" />
        <path
                d="M11 13h18v12H18l-5 4v-4h-2V13Z"
                fill="#ffffff"
        />
      </svg>
      <span>Kontakt</span>
    </a>

    <a class="nav-link" href="#meny">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" />
        <path
                d="M12 13h2m4 0h10M12 20h2m4 0h10M12 27h2m4 0h10"
                stroke="#ffffff"
                stroke-width="2.5"
        />
      </svg>
      <span>Meny</span>
    </a>
  </nav>
</header>

<div class="title-section">
  <h1 class="page-title">Checklista</h1>
</div>

<main id="main-content">
  <div class="breadcrumb">
    <a href="../index.html">Start</a>
    <span aria-hidden="true"> &gt; </span>
    <span aria-current="page">Checklista</span>
  </div>

  <div class="page-content">
    <section
            class="checklist-card"
            aria-label="Checklista för internetsäkerhet"
    >

      <!-- Progressbar -->

      <div class="progress-container">
        <div
                class="progress-bar"
                role="progressbar"
                id="progress-bar"
                aria-label="Avklarade punkter"
                aria-valuemin="0"
                aria-valuemax="12"
                aria-valuenow="0"
        >
          <div
                  class="progress-fill"
                  id="progress-fill"
          ></div>
        </div>

        <p
                class="progress-text"
                id="progress-text"
                role="status"
                aria-live="polite"
                aria-atomic="true"
        >
          Kryssa i en ruta när du är klar med en punkt!
        </p>
      </div>

      <!-- Checklista med 12 punkter -->

      <ul class="checklist">
        <li class="checklist-item">
          <input type="checkbox" id="check1" />
          <label for="check1">
            Använd olika lösenord för dina olika konton.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check2" />
          <label for="check2">
            Spara dina lösenord på ett säkert ställe. Du kan använda en app som kallas lösenordshanterare.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check3" />
          <label for="check3">
            Slå på extra skydd när du loggar in, om det finns. Det kan vara en kod i mobilen. Det kallas tvåstegsverifiering.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check4" />
          <label for="check4">
            Ställ in din mobil, dator och dina appar så att de uppdateras automatiskt.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check5" />
          <label for="check5">
            Lås din mobil och dator med en kod, ett lösenord eller ditt fingeravtryck.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check6" />
          <label for="check6">
            Ladda bara ner appar från officiella appbutiker, till exempel App Store eller Google Play.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check7" />
          <label for="check7">
            Kontrollera vem som har skickat meddelandet. Gör det innan du svarar eller klickar på en länk.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check8" />
          <label for="check8">
            Skriv själv in webbadressen när du ska logga in på banken eller andra viktiga konton.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check9" />
          <label for="check9">
            Ge aldrig dina lösenord, bankuppgifter eller engångskoder till någon annan. En engångskod är en kod som bara används en gång.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check10" />
          <label for="check10">
            Ring banken direkt om du har gett någon dina bankuppgifter av misstag eller tror att någon försöker lura dig.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check11" />
          <label for="check11">
            Blockera och anmäl konton och meddelanden som verkar misstänkta.
          </label>
        </li>

        <li class="checklist-item">
          <input type="checkbox" id="check12" />
          <label for="check12">
            Spara en extra kopia av dina viktiga bilder och dokument.
          </label>
        </li>
      </ul>

      <!-- Knapp för att börja om -->

      <div class="reset-container">
        <button
                class="reset-button"
                id="reset-button"
                type="button"
        >
          Börja om
        </button>
      </div>
    </section>
  </div>
</main>

<script>
  // Hämta alla kryssrutor och element

  const checkboxes = document.querySelectorAll(
          '.checklist input[type="checkbox"]'
  );

  const progressFill = document.getElementById(
          "progress-fill"
  );

  const progressBar = document.getElementById(
          "progress-bar"
  );

  const progressText = document.getElementById(
          "progress-text"
  );

  const resetButton = document.getElementById(
          "reset-button"
  );

  const total = checkboxes.length;
  progressBar.setAttribute("aria-valuemax", total);

  const storageKey = "trygg-pa-internet-checklista";

  // Uppdatera progressbar och textfeedback

  function updateProgress() {
    const completed = Array.from(checkboxes).filter(
            checkbox => checkbox.checked
    ).length;

    const percentage = total > 0 ? (completed / total) * 100 : 0;

    progressFill.style.width = percentage + "%";

    progressBar.setAttribute(
            "aria-valuenow",
            completed
    );

    // Anpassad återkoppling

    if (completed === 0) {
      progressText.textContent =
              "Kryssa i en ruta när du är klar med en punkt!";
    } else if (completed === total) {
      progressText.textContent =
              `Bra jobbat! Du är klar med alla ${total} punkter!`;
    } else if (completed >= Math.ceil(total * 0.75)) {
      progressText.textContent =
              `Nästan klar! ${completed} av ${total} punkter klara!`;
    } else if (completed >= Math.ceil(total * 0.25)) {
      progressText.textContent =
              `Bra jobbat! ${completed} av ${total} punkter klara!`;
    } else {
      progressText.textContent =
              `Bra start! ${completed} av ${total} punkter klara!`;
    }
  }

  // Spara användarens val

  function saveProgress() {
    const checkedItems = Array.from(checkboxes).map(
            checkbox => checkbox.checked
    );

    try {
      localStorage.setItem(
              storageKey,
              JSON.stringify(checkedItems)
      );
    } catch (error) {
      // Checklistan fungerar även om lagring är blockerad.
    }
  }

  // Läs in tidigare sparade val

  function loadProgress() {
    try {
      const savedProgress = localStorage.getItem(
              storageKey
      );

      if (savedProgress !== null) {
        const checkedItems = JSON.parse(savedProgress);

        if (Array.isArray(checkedItems)) {
          checkboxes.forEach((checkbox, index) => {
            checkbox.checked =
                    checkedItems[index] === true;
          });
        }
      }
    } catch (error) {
      // Använd en tom checklista om lagring saknas.
    }

    updateProgress();
  }

  // Lyssna efter ändringar i kryssrutorna

  checkboxes.forEach(checkbox => {
    checkbox.addEventListener("change", () => {
      updateProgress();
      saveProgress();
    });
  });

  // Återställ hela checklistan

  resetButton.addEventListener("click", () => {
    checkboxes.forEach(checkbox => {
      checkbox.checked = false;
    });

    updateProgress();
    saveProgress();
  });

  // Starta checklistan

  loadProgress();
</script>
<script src="../easy-read.js"></script>
</body>
</html>
